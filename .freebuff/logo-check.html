<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  body{font-family:sans-serif;background:#fff8f5;margin:0;padding:24px;display:flex;gap:28px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center;padding:16px;border-radius:14px}
  .light{background:#fff8f5}.navy{background:#161b2f}.peach{background:#ffa586}.cream{background:#fff}
  .lbl{font-size:12px;color:#333}
  .chip{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 12px rgba(22,27,47,.25)}
  .chip img{width:100%;height:100%;object-fit:contain;padding:5px}
  .big{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
  .big img{width:100%;height:100%;object-fit:contain;padding:14px}
</style></head>
<body>
  <div class="col light"><div class="lbl">logomark / white</div><div class="chip" style="background:#fff"><img src="../brivia/public/logomark.png"></div></div>
  <div class="col navy"><div class="lbl" style="color:#eee">logomark / navy</div><div class="chip" style="background:#242f49"><img src="../brivia/public/logomark.png"></div></div>
  <div class="col peach"><div class="lbl">logomark / peach</div><div class="chip" style="background:#ffa586"><img src="../brivia/public/logomark.png"></div></div>
  <div class="col light"><div class="lbl">brivia-mark / white</div><div class="chip" style="background:#fff"><img src="../brivia/public/brivia-mark.png"></div></div>
  <div class="col navy"><div class="lbl" style="color:#eee">brivia-mark / navy</div><div class="chip" style="background:#242f49"><img src="../brivia/public/brivia-mark.png"></div></div>
  <div class="col light"><div class="lbl">logobriv full</div><div class="big" style="background:#fff"><img src="../brivia/public/logobriv.png"></div></div>
  <div class="col navy"><div class="lbl" style="color:#eee">logomark big on navy</div><div class="big" style="background:#242f49"><img src="../brivia/public/logomark.png"></div></div>
</body>
</html>
